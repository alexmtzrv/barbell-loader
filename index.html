<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barbell Loader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header>
    <h1 class="title">Barbell Loader</h1>
</header>
<main class="main-content">
    <div class="main-calculator">
        <form action="" class="user-form">
            <input type="radio" name="barbell" id="35-lb-barbell" value="35" checked>
            <label for="35-lb-barbell">35 lbs</label>
            <input type="radio" name="barbell" id="45-lb-barbell" value="45">
            <label for="45-lb-barbell">45 lbs</label>
            <label for="referenced-weight">Enter weight to be referenced</label>
            <input type="number" name="" id="referenced-weight">
            <label for="percentage">Enter percentage</label>
            <input type="number" name="" id="percentage">
            <button id="button" type="button">Load</button>
        </form>
    </div>
    <div class="main-loads-container">
        <h2>Loads</h2>
        <ol class="loads-ol"></ol>
    </div>
</main>
<script src="index.js"></script>
</body>
</html>
