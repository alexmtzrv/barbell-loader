<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barbell Loader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="main-content">
    <header>
        <h1 class="main-title">BARBELL LOADER</h1>
    </header>
    <div class="main-form">
        <form action="" class="form-body">
            <fieldset class="form-barbell-weight">
                <legend class="barbell-weight-text">Barbell Weight</legend>
                <div class="barbell-weight-radio-group">
                    <div class="radio-group-35-lb">
                        <input type="radio" name="barbell" id="35-lb-barbell" value="35" checked>
                        <label for="35-lb-barbell">35 lbs</label>
                    </div>
                    <div class="radio-group-45-lb">
                        <input type="radio" name="barbell" id="45-lb-barbell" value="45">
                        <label for="45-lb-barbell">45 lbs</label>
                    </div>
                </div>
            </fieldset>
            <div class="form-reference-weight">
                <div class="reference-weight-text">
                    <label for="referenced-weight">Enter weight to be referenced</label>
                </div>
                <div class="reference-weight-input">
                    <input type="number" name="referencedWeight" id="referenced-weight"  min="35" max="100" step="0.5">
                    <span>lbs</span>
                </div>
            </div>
            <div class="form-percentage">
                <div class="percentage-text">
                    <label for="percentage">Enter percentage</label>
                </div>
                <div class="percentage-input">
                    <input type="number" name="percentage" id="percentage" min="10" max="100" step="0.5">
                    <span>%</span>
                </div>
            </div>
            <div class="form-button">
                <button id="button" type="button">LOAD!</button>
            </div>
        </form>
    </div>
    <div class="main-results">
        <h2 class="results-title">
            RESULTS
        </h2>
        <div class="results-section">
            <div class="results-card">
                <div class="card-percentage">
                    <p class="card-percentage-text"></p>
                </div>
                <div class="card-barbell">
                    <p class="card-barbell-text"></p>
                    <div class="card-barbell-draw">
                        <span class="barbell-draw-barrel"></span>
                        <span class="barbell-draw-collar"></span>
                        <span class="barbell-draw-tube"></span>
                        <span class="barbell-draw-collar"></span>
                        <span class="barbell-draw-barrel"></span>
                    </div>
                </div>
                <div class="card-plates">
                    <p class="card-plates-title"></p>
                    <div class="plates-display">
                        <span class="plates-display-draw"></span>
                        <span class="plates-display-draw"></span>
                        <span class="plates-display-draw"></span>
                        <span class="plates-display-draw"></span>
                    </div>
                    <p class="plates-display-remaining-weight"></p>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="index.js"></script>
</body>
</html>
