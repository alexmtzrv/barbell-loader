<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Barbell Loader</title>

    <link rel="stylesheet" href="style.css">

<body>
<main class="main-content">
    <header>
        <h1 class="main-title section-title">Barbell Loader</h1>
    </header>
    <div class="main-form">
        <form action="" class="form-body">
            <div class="form-barbell-weight input-style">
                <div class="barbell-weight-text input-style-title">Barbell Weight (lb)</div>
                <div class="barbell-weight-input input-style-section">
                    <select id="barbellWeightSelect" class="barbell-weight-select input-style-input">
                        <option value="35">35</option>
                        <option value="45">45</option>
                    </select>
                    <span>LB</span>
                </div>
            </div>
            <div class="form-reference-weight input-style">
                <div class="reference-weight-text input-style-title">
                    <label for="referenced-weight">PR Weight (lb)</label>
                </div>
                <div class="input-style-section">
                    <input type="number" name="referencedWeight" id="referenced-weight" class="input-style-input">
                    <span>LB</span>
                </div>
            </div>
            <div class="form-percentage input-style">
                <div class="percentage-text input-style-title">
                    <label for="percentage">Percentage (%)</label>
                </div>
                <div class="input-style-section">
                    <input type="number" name="percentage" id="percentage" class="input-style-input">
                    <span>LB</span>
                </div>
            </div>
            <div class="form-button">
                <button id="button" type="button">LOAD WEIGHT</button>
            </div>
        </form>
    </div>

        <h2 class="results-title section-title">
            Results
