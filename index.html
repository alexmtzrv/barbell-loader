<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barbell Loader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="main-content">
    <header>
<!--        <h1 class="main-title section-title">Barbell Loader</h1>-->
    </header>
    <div class="main-form">
        <form action="" class="form-body">
            <div class="form-barbell-weight input-style">
                <div class="barbell-weight-text input-style-title">Barbell Weight (lb)</div>
                <div class="barbell-weight-input input-style-section">
                    <select id="barbellWeightSelect" class="barbell-weight-select input-style-input">
                        <option value="35">35</option>
                        <option value="45" selected>45</option>
                    </select>
<!--                    <span id="select-arrow"></span>-->
                    <span>LB</span>
                </div>
            </div>
            <div class="form-reference-weight input-style">
                <div class="reference-weight-text input-style-title">
                    <label for="referenced-weight">PR Weight (lb)</label>
                </div>
                <div class="input-style-section">
                    <input type="number" name="referencedWeight" id="referenced-weight" class="input-style-input" required>
                    <span>LB</span>
                </div>
            </div>
            <div class="form-percentage input-style">
                <div class="percentage-text input-style-title">
                    <label for="percentage">Percentage (%)</label>
                </div>
                <div class="input-style-section">
                    <input type="number" name="percentage" id="percentage" class="input-style-input" required>
                    <span>LB</span>
                </div>
            </div>
            <div class="form-button">
                <button id="buttonClear" type="button">CLEAR ALL</button>
                <button id="buttonLoad" type="button">LOAD WEIGHT</button>
            </div>
        </form>
    </div>
    <div class="main-results">
        <h2 class="results-title section-title">
            Results
        </h2>
        <div id="resultsSection" class="results-section">
        </div>
    </div>
</main>
<script src="index.js"></script>
</body>
</html>
